[project]
name = "orchard-rover"
version = "0.1.0"
description = "Parametric CAD (CadQuery) for an orchard robot: 6-wheel rocker-bogie rover + 6-axis arm with interchangeable tools"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4",
    "ezdxf>=1.1",
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "cairosvg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["orchard_rover"]
